checksumBehavior: update

nodeLinker: node-modules

packageExtensions:
  debug@*:
    dependencies:
      supports-color: "*"

pnpMode: loose

compressionLevel: mixed

enableGlobalCache: false

enableImmutableInstalls: false

yarnPath: .yarn/releases/yarn-4.17.1.cjs

# picomatch has a ReDoS advisory with no patched version (<= 4.0.7 is the newest release). It is reached only through
# Vite's build tooling (tinyglobby), which globs this repository's own files at build time and does not ship in the proxy or
# the web assets. Remove this entry when picomatch publishes a fixed version.
npmAuditIgnoreAdvisories:
  - "1247710" # GHSA-fc5q-39xc-vjpf
