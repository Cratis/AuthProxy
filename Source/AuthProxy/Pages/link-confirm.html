<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add a Sign-In Method</title>
    <style>
        body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f5f5f5; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.12); padding: 2.5rem 3rem; text-align: center; max-width: 480px; width: 100%; }
        h1 { font-size: 1.5rem; font-weight: 700; margin: 0 0 .75rem; color: #333; }
        p  { color: #666; margin: 0 0 1.5rem; }
        button { display: block; width: 100%; box-sizing: border-box; padding: .75rem 1.5rem; border: none; border-radius: 6px; background: #0078d4; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
        button:hover { background: #005a9e; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Add a Sign-In Method</h1>
        <p>Continue to add <strong>__CRATIS_LINK_PROVIDER__</strong> to your account.</p>
        <form method="post" action="__CRATIS_LINK_ACTION__">
            <input type="hidden" name="token" value="__CRATIS_LINK_TOKEN__" />
            <input type="hidden" name="returnUrl" value="__CRATIS_LINK_RETURN_URL__" />
            <input type="hidden" name="__CRATIS_LINK_ANTIFORGERY_FIELD__" value="__CRATIS_LINK_ANTIFORGERY_TOKEN__" />
            <button type="submit">Continue</button>
        </form>
    </div>
</body>
</html>
