<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enter your code</title>
    <style>
        body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f5f5f5; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.12); padding: 2.5rem 3rem; max-width: 480px; width: 100%; }
        h1 { font-size: 1.5rem; font-weight: 700; margin: 0 0 .75rem; color: #333; }
        p { color: #666; margin: 0 0 1.5rem; }
        label { display: block; font-weight: 600; margin-bottom: .35rem; color: #333; }
        input[type=text] { width: 100%; box-sizing: border-box; padding: .7rem .8rem; border: 1px solid #bbb; border-radius: 6px; font-size: 1.4rem; letter-spacing: .3em; text-align: center; margin-bottom: 1rem; }
        button { display: block; width: 100%; box-sizing: border-box; padding: .75rem 1.5rem; border: none; border-radius: 6px; background: #0078d4; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
        button:hover { background: #005a9e; }
        .error { color: #b00020; display: none; }
    </style>
</head>
<body data-error="__CRATIS_CODE_ERROR__">
    <div class="card">
        <h1>Enter your code</h1>
        <p>If <strong>__CRATIS_CODE_ADDRESS__</strong> can sign in, a code is on its way. It stays valid for a few minutes.</p>
        <p class="error" data-for="wrong">That code did not work. Check it and try again.</p>
        <form method="post" action="__CRATIS_CODE_ACTION__">
            <input type="hidden" name="state" value="__CRATIS_CODE_STATE__" />
            <input type="hidden" name="step" value="verify" />
            <input type="hidden" name="address" value="__CRATIS_CODE_ADDRESS__" />
            <input type="hidden" name="challenge" value="__CRATIS_CODE_CHALLENGE__" />
            <label for="code">Code</label>
            <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="__CRATIS_CODE_LENGTH__" required autofocus />
            <button type="submit">Sign in</button>
        </form>
    </div>
    <script>
        var error = document.body.getAttribute('data-error');
        document.querySelectorAll('.error').forEach(function (element) {
            if (element.getAttribute('data-for') === error) { element.style.display = 'block'; }
        });
    </script>
</body>
</html>
