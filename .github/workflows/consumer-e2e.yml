name: Consumer E2E

# Builds AuthProxy and exercises the real Arc sample and independent OAuth-grant receiver (E2E/run.sh).
on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  consumer-e2e:
    name: consumer-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Run the consumer lane
        run: bash E2E/run.sh

      - name: Upload container logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consumer-e2e-logs
          # Never upload the per-run TLS/envelope private material, even if container cleanup fails.
          path: .ai-work/e2e/compose.log
          if-no-files-found: ignore
