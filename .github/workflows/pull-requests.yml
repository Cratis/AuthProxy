name: Pull Requests

run-name: ${{ github.event.pull_request.title }} ${{ contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action) && '[meta]' || '[code]' }}

# One caller for every pull-request check so a single always-running `gate` job can require them all.
# A path-filtered workflow that never starts never reports; here each callee is skipped by `changes`
# instead, and a skipped job counts as passed in `gate`. Label and edit events (`[meta]` runs) skip
# the heavy jobs and run only `changes` and `policy`; their `gate` waits for the head commit's latest
# `[code]` run and passes only if that run succeeded, so a cancelled code run still cannot let a
# later run pass without having built anything.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}${{ contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action) && '-meta' || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ${{ vars.RUNNER_GATE || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
      prerelease: ${{ steps.filter.outputs.prerelease }}
      azure-docs: ${{ steps.filter.outputs.azure-docs }}
      e2e: ${{ steps.filter.outputs.e2e }}
      redis-replay: ${{ steps.filter.outputs.redis-replay }}
    steps:
      # The pull request files API lists at most 3,000 files, so a larger pull request could hide
      # changed paths from the filter and skip checks. Fail closed instead of filtering a partial list.
      - name: Refuse pull requests the filter cannot see in full
        env:
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          if [ "${CHANGED_FILES:-0}" -ge 3000 ]; then
            echo "::error title=changes::This pull request changes $CHANGED_FILES files; split it so path filtering sees every file."
            exit 1
          fi
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            redis-replay:
              - "Source/AuthProxy/BearerRoutes/**"
              - "Source/AuthProxy/Configuration/Dpop*.cs"
              - "Source/AuthProxy/Configuration/BearerRoute*.cs"
              - "Source/AuthProxy/Configuration/AuthProxy.cs"
              - "Source/AuthProxy/AuthProxy.csproj"
              - "Source/AuthProxy/Properties/AssemblyInfo.cs"
              - "Source/AuthProxy.Specs/BearerRoutes/for_DpopProofVerifier/**"
              - "Source/AuthProxy.Integration.Specs/**"
              - "Directory.*"
              - "global.json"
              - "NuGet.config"
              - "AuthProxy.slnx"
              - ".github/workflows/redis-replay-specs.yml"
              - ".github/workflows/pull-requests.yml"
            dotnet:
              - "Source/**"
              - ".github/workflows/**"
            prerelease:
              - "Source/**"
              - ".github/workflows/**"
            azure-docs:
              - "Documentation/azure/**"
              - ".github/workflows/azure-docs-specs.yml"
              - ".github/workflows/pull-requests.yml"
            e2e:
              - "Source/**"
              - "E2E/**"
              - "Docker/**"
              - ".github/workflows/consumer-e2e.yml"
              - ".github/workflows/pull-requests.yml"

  dotnet-build:
    needs: changes
    if: ${{ needs.changes.outputs.dotnet == 'true' && !contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action) }}
    uses: ./.github/workflows/dotnet-build.yml
    permissions:
      contents: read

  prerelease:
    needs: changes
    if: ${{ needs.changes.outputs.prerelease == 'true' && !contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action) }}
    uses: ./.github/workflows/pr-prerelease.yml
    permissions:
      contents: read

  azure-docs-specs:
    needs: changes
    if: ${{ needs.changes.outputs.azure-docs == 'true' && !contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action) }}
    uses: ./.github/workflows/azure-docs-specs.yml
    permissions:
      contents: read

  consumer-e2e:
    needs: changes
    if: ${{ needs.changes.outputs.e2e == 'true' && !contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action) }}
    uses: ./.github/workflows/consumer-e2e.yml
    permissions:
      contents: read

  redis-replay-specs:
    needs: changes
    if: ${{ needs.changes.outputs.redis-replay == 'true' && !contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action) }}
    uses: ./.github/workflows/redis-replay-specs.yml
    permissions:
      contents: read

  # No filter on code runs: the security checks must always run (their old trigger had no paths).
  security:
    if: ${{ !contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action) }}
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  # No filter: the policy check must always run (its old trigger had no paths).
  policy:
    uses: ./.github/workflows/verify-pull-request-policy.yml
    permissions:
      contents: read
      pull-requests: write

  # Every other job in this file MUST be listed in `needs`: a job left out is invisible to the gate.
  gate:
    name: gate
    if: ${{ always() }}
    needs: [changes, dotnet-build, prerelease, azure-docs-specs, consumer-e2e, redis-replay-specs, security, policy]
    runs-on: ${{ vars.RUNNER_GATE || 'ubuntu-latest' }}
    timeout-minutes: ${{ contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action) && 95 || 5 }}
    permissions:
      actions: read
    steps:
      - name: Every needed job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key)\t\(.value.result)"'
          # Fail closed: anything other than success or skipped (failure, cancelled, or a result we do not know) fails.
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result | IN("success","skipped") | not) | .key')
          # `changes` is the only job that decides what is skipped, so it must have succeeded, never been skipped.
          [ "$(echo "$NEEDS" | jq -r '.changes.result')" = "success" ] || bad="$bad changes"
          if [ -n "${bad// /}" ]; then
            echo "::error title=gate::Failed, cancelled or unknown: $bad"
            exit 1
          fi
      # Label and edit runs build nothing, so they pass only when the head commit's latest code run did.
      - name: Head commit's code run passed
        if: ${{ contains(fromJSON('["edited","labeled","unlabeled"]'), github.event.action) }}
        uses: Cratis/Workflows/.github/actions/pr-code-run-gate@main
        with:
          head-sha: ${{ github.event.pull_request.head.sha }}
