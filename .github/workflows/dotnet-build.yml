name: .NET Build

# Called from pull-requests.yml; the PR triggers and path filters live there.
concurrency:
  group: dotnet-build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: |
    10.0.x
    11.0.x

on:
  workflow_dispatch:
  workflow_call:

jobs:
  dotnet-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: Cratis/Workflows/.github/actions/dotnet-cache@3f8a8a7ef75f72b6b089638b68ec2f9af8f593e3
        with:
          mode: restore
          path: ~/.nuget/packages
          key-files: |
            **/*.csproj
            **/*.props
            **/*.targets
            **/packages.lock.json
            **/[Nn]u[Gg]et.[Cc]onfig
            global.json
            AuthProxy.slnx

      # Debug and Release are not the same gate: the spec projects and several analyzer paths only compile
      # under Debug, so a Release-only build can go green over code that does not compile for anyone
      # working on it locally.
      - name: Build (Debug)
        run: dotnet build --configuration Debug -warnaserror

      - name: Build (Release)
        run: dotnet build --configuration Release -warnaserror

      # xUnit v3 spec projects are executables; the process exit code fails the step.
      - name: Test
        run: |
          mkdir -p TestResults
          failed=0
          # Aspire.Specs also runs on net10.0: the Aspire library multi-targets net10.0 and net11.0.
          for run in Aspire.Specs:net10.0 Aspire.Specs:net11.0 AuthProxy.Security.Specs:net11.0 AuthProxy.Specs:net11.0; do
            spec="${run%%:*}"
            tfm="${run##*:}"
            "./Source/${spec}/bin/Debug/${tfm}/${spec}" -result-trx "${PWD}/TestResults/${spec}.${tfm}.trx" || failed=1
          done
          exit "${failed}"

      - name: Upload spec results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spec-results
          path: TestResults
          retention-days: 7
