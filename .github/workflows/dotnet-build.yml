name: .NET Build

env:
  DOTNET_VERSION: "10.0.x"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
    paths:
      - "Source/**"
      - ".github/workflows/**"

jobs:
  dotnet-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Debug and Release are not the same gate: the spec projects and several analyzer paths only compile
      # under Debug, so a Release-only build can go green over code that does not compile for anyone
      # working on it locally.
      - name: Build (Debug)
        run: dotnet build --configuration Debug

      - name: Build (Release)
        run: dotnet build --configuration Release

      - name: Test
        run: >
          dotnet test
          --configuration Debug
          --no-build
          --logger "trx;LogFileName=specs.trx"
          --results-directory TestResults

      - name: Upload spec results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-results
          path: TestResults
          retention-days: 14
