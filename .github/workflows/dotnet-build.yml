name: .NET Build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
    paths:
      - "Source/**"
      - ".github/workflows/**"

jobs:
  dotnet-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Debug and Release are not the same gate: the spec projects and several analyzer paths only compile
      # under Debug, so a Release-only build can go green over code that does not compile for anyone
      # working on it locally.
      - name: Build (Debug)
        run: dotnet build --configuration Debug

      - name: Build (Release)
        run: dotnet build --configuration Release

      # xUnit v3 spec projects are executables; the process exit code fails the step.
      - name: Test
        run: |
          mkdir -p TestResults
          failed=0
          for spec in Aspire.Specs AuthProxy.Security.Specs AuthProxy.Specs; do
            "./Source/${spec}/bin/Debug/net10.0/${spec}" -result-trx "${PWD}/TestResults/${spec}.trx" || failed=1
          done
          exit "${failed}"

      - name: Upload spec results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spec-results
          path: TestResults
          retention-days: 7
