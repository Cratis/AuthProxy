name: Azure Documentation Specs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "Documentation/azure/**"
      - ".github/workflows/azure-docs-specs.yml"
  push:
    branches:
      - main
    paths:
      - "Documentation/azure/**"
      - ".github/workflows/azure-docs-specs.yml"

jobs:
  azure-docs-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Azure documentation specs
        run: python3 -B -m unittest discover -s Documentation/azure/specs -v
