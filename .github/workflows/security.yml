name: Security

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runs on every pull request, deliberately without a `paths:` filter.
#
# AuthProxy is the component that decides who reaches everything behind it, so the security specs are not
# gated on which files a change happens to touch: a workflow edit, a dependency bump, or a configuration
# default can all move the security posture without any file under Source/ changing. The suite is fast
# enough to run unconditionally, and a gate that only sometimes runs is not a gate.

env:
  DOTNET_VERSION: "10.0.x"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main

jobs:
  security-specs:
    name: Security specs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build security specs
        run: dotnet build Source/AuthProxy.Security.Specs/AuthProxy.Security.Specs.csproj --configuration Release

      - name: Run security specs
        run: >
          dotnet test Source/AuthProxy.Security.Specs/AuthProxy.Security.Specs.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=security-specs.trx"
          --results-directory TestResults

      - name: Upload security spec results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-spec-results
          path: TestResults
          retention-days: 14

  frontend-dependency-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.19.5

      # Use the Yarn binary committed by the repository, keep the lockfile immutable, and skip all
      # dependency lifecycle scripts. The job has read-only repository permissions and no credentials.
      - name: Install dependencies without scripts
        working-directory: ./Source/Web
        env:
          YARN_ENABLE_SCRIPTS: "false"
        run: |
          test "$(node .yarn/releases/yarn-4.17.1.cjs --version)" = "4.17.1"
          node .yarn/releases/yarn-4.17.1.cjs install --immutable --mode=skip-build

      # Keep lower-severity findings visible without making them the gate. The following step explicitly
      # fails the job when npm reports a HIGH or CRITICAL advisory anywhere in the dependency graph.
      - name: Report moderate dependency vulnerabilities
        continue-on-error: true
        working-directory: ./Source/Web
        run: node .yarn/releases/yarn-4.17.1.cjs npm audit --recursive --severity moderate

      - name: Block high and critical dependency vulnerabilities
        working-directory: ./Source/Web
        run: node .yarn/releases/yarn-4.17.1.cjs npm audit --recursive --severity high

  vulnerable-dependencies:
    name: Vulnerable dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      # OWASP A06 — Vulnerable and Outdated Components. `dotnet list package` reports advisories but always
      # exits 0, so the output is inspected and the job failed explicitly; otherwise a known-vulnerable
      # dependency would be reported into a green check that nobody reads.
      - name: Check for known vulnerable packages
        run: |
          set -euo pipefail

          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt

          if grep -qE '^\s*>\s' vulnerable.txt; then
            echo "::error::One or more packages have known vulnerabilities. See the report above."
            exit 1
          fi

          echo "No known vulnerable packages."

      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vulnerable-dependency-report
          path: vulnerable.txt
          retention-days: 14
